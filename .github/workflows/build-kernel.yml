name: Build Kernel

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential ccache curl flex \
            git gnupg gperf libncurses-dev libreadline-dev lz4 libssl-dev \
            libxml2-utils lzop pngcrush rsync schedtool squashfs-tools \
            xsltproc zip zlib1g-dev python3 python3-pip device-tree-compiler \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Download Android Clang 12
        run: |
          mkdir -p $HOME/toolchain
          cd $HOME/toolchain
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-12.0.0_r1/clang-r416183b.tar.gz
          tar xzf clang-r416183b.tar.gz
          sudo ln -sf /usr/bin/python3 /usr/local/bin/python
          sudo ln -sf /lib/x86_64-linux-gnu/libtinfo.so.6 /lib/x86_64-linux-gnu/libtinfo.so.5
          sudo ldconfig
          $HOME/toolchain/bin/clang --version

      - name: Build kernel
        run: |
          export PATH="$HOME/toolchain/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export HOSTCC=clang
          export HOSTCXX=clang++
          export LD=ld.lld
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          which clang
          clang --version
          make O=out ARCH=arm64 CC=clang HOSTCC=clang HOSTCXX=clang++ CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- blossom_defconfig
          make O=out ARCH=arm64 CC=clang HOSTCC=clang HOSTCXX=clang++ CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) Image.gz KCFLAGS="-w"

      - name: Upload Image.gz
        uses: actions/upload-artifact@v4
        with:
          name: Image.gz
          path: out/arch/arm64/boot/Image.gz
          if-no-files-found: error
