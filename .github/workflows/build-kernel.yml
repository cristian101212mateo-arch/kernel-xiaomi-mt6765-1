name: Build Kernel

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential ccache curl flex \
            git gnupg gperf libncurses-dev libreadline-dev lz4 libssl-dev \
            libxml2-utils lzop pngcrush rsync schedtool squashfs-tools \
            xsltproc zip zlib1g-dev python3 python3-pip device-tree-compiler \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            clang-14 lld-14

      - name: Verify Clang
        run: |
          clang-14 --version
          ld.lld-14 --version

      - name: Build kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang-14
          export HOSTCC=clang-14
          export HOSTCXX=clang++-14
          export LD=ld.lld-14
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          make O=out ARCH=arm64 CC=clang-14 HOSTCC=clang-14 HOSTCXX=clang++-14 CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- blossom_defconfig
          make O=out ARCH=arm64 CC=clang-14 HOSTCC=clang-14 HOSTCXX=clang++-14 CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) Image.gz KCFLAGS="-w"

      - name: Upload Image.gz
        uses: actions/upload-artifact@v4
        with:
          name: Image.gz
          path: out/arch/arm64/boot/Image.gz
          if-no-files-found: error
